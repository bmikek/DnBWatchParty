<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 250px; font-family: sans-serif; padding: 10px; text-align: center; }
    button { width: 100%; padding: 8px; margin: 5px 0; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; font-weight: bold; }
    button:hover { background: #45a049; }
    input { width: 90%; padding: 8px; margin: 5px 0; text-align: center; border: 1px solid #ccc; border-radius: 4px; text-transform: uppercase; }
    #status { margin-top: 10px; font-size: 12px; color: #555; font-weight: bold; }
  </style>
</head>
<body>
  <h3>BnD Watch Party</h3>
  
  <button id="createBtn">Create New Room</button>
  
  <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

  <input type="text" id="joinInput" placeholder="Enter Code (XXXX-XXXX)">
  <button id="joinBtn">Join Room</button>

  <div id="status">Not connected</div>

  <script src="popup.js"></script>
</body>
</html>
